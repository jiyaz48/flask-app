
name: Flask Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py


      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:${{ github.sha }}

      - name: Display GitHub repository identifiers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::399643456722:role/GitHubActions-EC2-Deploy
          aws-region: us-east-2

      - name: Deploy to EC2 using AWS Systems Manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07b3b52f8397ae82b" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask application from GitHub Actions" \
            --parameters '{"commands":["cd /home/ubuntu/antigravity-devops && docker compose pull && docker compose up -d --wait && docker compose ps"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07b3b52f8397ae82b"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-07b3b52f8397ae82b" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07b3b52f8397ae82b" \
            --query "StandardOutputContent" \
            --output text
